name: Daily GitHub digest

on:
  schedule:
    - cron: '30 5 * * *'      # tous les jours à 05:30 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write             # pour committer public/digest.json
  models: read                # IA gratuite GitHub Models (utilisée si USE_LLM = '1')

jobs:
  digest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Build digest
        run: node scripts/build-digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: GeniusVentures
          DAYS: '7'
          USE_LLM: '1'        # '1' = résumés rédigés par un modèle gratuit (GitHub Models) ; '0' = règles seulement
          # Fournisseur IA optionnel (Settings > Secrets and variables > Actions). Vide = GitHub Models.
          LLM_URL: ${{ vars.LLM_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_KEY: ${{ secrets.LLM_API_KEY }}
      - name: Commit result
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add public/digest.json public/history.json
          git diff --cached --quiet || (git commit -m "chore: update digest" && git push)
