name: Daily GitHub digest

on:
  schedule:
    - cron: '30 5 * * *'      # tous les jours à 05:30 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write             # pour committer public/digest.json
  models: read                # IA gratuite GitHub Models (utilisée si USE_LLM = '1')

# digest et alertes écrivent dans le même repo : on les passe l'un après l'autre (jamais en même temps)
concurrency:
  group: gnus-digest-writes
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15        # une lecture de blockchain qui se bloque ne doit pas bloquer le job
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}     # utilisés aussi par l'étape « Notify failure »
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Download ethers (reads the liquidity pools)
        run: curl -fsSL --retry 2 --max-time 30 -o scripts/ethers.umd.min.js https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js
        continue-on-error: true   # sans lui, seule la liquidité est ignorée
      - name: Build digest
        run: node --version && node scripts/build-digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: GeniusVentures
          DAYS: '7'
          USE_LLM: '1'        # '1' = résumés rédigés par un modèle gratuit (GitHub Models) ; '0' = règles seulement
          # Fournisseur IA optionnel (Settings > Secrets and variables > Actions). Vide = GitHub Models.
          LLM_URL: ${{ vars.LLM_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_KEY: ${{ secrets.LLM_API_KEY }}
          SITE_URL: https://gnus-digest.vercel.app
          # Telegram (facultatif) : secrets TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID ; vides = aucun envoi
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOW_MULTIPLE_PER_DAY: ${{ vars.TELEGRAM_ALLOW_MULTIPLE_PER_DAY }}   # Variables (pas Secrets) : '1' = plusieurs envois par jour
      - name: Commit result
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add public/
          if git diff --cached --quiet; then echo "Nothing to commit"; else
            git commit -m "chore: update digest"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
      - name: Notify failure
        if: failure() && env.TELEGRAM_BOT_TOKEN != ''
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠ ${WORKFLOW} failed. The site keeps showing the previous data. Details: ${RUN_URL}" > /dev/null
        env:
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
