name: Daily GitHub digest

on:
  schedule:
    - cron: '30 5 * * *'      # tous les jours à 05:30 UTC
  workflow_dispatch:          # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write             # pour committer public/digest.json
  # models: read              # à décommenter seulement si USE_LLM = '1' (IA gratuite GitHub Models)

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build digest
        run: node scripts/build-digest.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: GeniusVentures
          DAYS: '7'
          USE_LLM: '1'        # '1' = reformulation par un modèle gratuit (optionnel)
      - name: Commit result
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add public/digest.json
          git diff --cached --quiet || (git commit -m "chore: update digest" && git push)
