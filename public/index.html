<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNUS digest — GitHub activity, mainnet readiness, liquidity</title>
<meta name="description" content="Daily digest of the GeniusVentures GitHub activity, GNUS mainnet readiness from the public docs, and on-chain liquidity depth.">
<meta property="og:type" content="website">
<meta property="og:title" content="GNUS digest">
<meta property="og:description" content="GitHub activity, mainnet readiness and liquidity depth for GNUS, updated daily from public sources.">
<meta property="og:image" content="https://gnus-digest.vercel.app/og.png"><!-- pour les aperçus Telegram/X : remplace par l'adresse complète, ex. https://ton-site.vercel.app/og.png -->
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#f4f1ec;--panel:#fff;--ink:#22201c;--mute:#716b62;--line:#ddd7cc;--accent:#8a4b12}
  @media (prefers-color-scheme:dark){:root{--bg:#1d1b18;--panel:#272420;--ink:#ece7de;--mute:#a39b8f;--line:#3a352e;--accent:#e0a367}}
  *{box-sizing:border-box}
  body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif}
  main{max-width:760px;margin:0 auto}
  h1{font-size:26px;margin:0 0 2px}
  .sub{color:var(--mute);font:13px system-ui,sans-serif;margin:0 0 22px}
  h2{font:600 13px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:26px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px}
  .date{font:600 13px system-ui,sans-serif;color:var(--mute);margin-bottom:4px}
  details{margin-top:8px;font:14px/1.45 system-ui,sans-serif;color:var(--mute)}
  summary{cursor:pointer;color:var(--accent)}
  details a{color:inherit;font-weight:600}
  ul{margin:6px 0 0;padding-left:18px}
  .stats{display:flex;flex-wrap:wrap;gap:8px 18px;font:14px system-ui,sans-serif;color:var(--mute);margin-top:6px}
  .stats b{color:var(--ink)}
  h3{font:600 15px system-ui,sans-serif;margin:16px 0 6px}
  h3 a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .trow{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .trow b{font:700 13px system-ui,sans-serif;letter-spacing:.02em}
  .pct{font:700 13px system-ui,sans-serif;color:var(--accent);white-space:nowrap}
  .segs{display:flex;gap:3px;margin:10px 0 6px}
  .seg{flex:1;height:8px;border-radius:2px;background:var(--line)}
  .seg.done{background:var(--accent)}.seg.progress{background:var(--accent);opacity:.45}
  .legend{font:12px system-ui,sans-serif;color:var(--mute);margin-bottom:8px}
  .it{font:14px/1.45 system-ui,sans-serif;padding:2px 0}.it .t{color:var(--mute);font-size:12px}
  .note{font:13px/1.45 system-ui,sans-serif;color:var(--mute);border-left:2px solid var(--accent);padding-left:10px;margin-top:8px}
  .badge{display:inline-block;font:600 12px system-ui,sans-serif;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--mute);margin-right:8px}
  .badge.done{color:#2e7d32;border-color:#2e7d32}.badge.progress{color:var(--accent);border-color:var(--accent)}
  .srow{padding:8px 0;border-bottom:1px solid var(--line);font:14px/1.45 system-ui,sans-serif}.srow:last-child{border-bottom:0}
  .srow .d{color:var(--mute);font-size:13px;margin-top:2px}
  .notice{border-left:3px solid var(--accent)}
  .notice .w{font:600 14px system-ui,sans-serif;color:var(--accent);margin-bottom:4px}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 22px}
  .kv .k{font:600 11px system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
  .kv .v{font:15px/1.4 system-ui,sans-serif}
  .kv .v .badge{margin-right:0}
  .kv a{color:var(--accent);text-decoration:none;font-weight:600;border-bottom:1px solid var(--line)}
  .warn{border-left:3px solid #c0392b}
  .warn .w{font:600 14px system-ui,sans-serif;color:#c0392b;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
  .grid2 .card{margin-bottom:0}
  svg.chart{width:100%;height:auto;color:var(--accent);display:block;margin:6px 0 2px}
  .arrow{color:var(--mute);margin:0 6px}
  .pr .b{flex:1;min-width:0}
  .pr .b a{display:block}
  .pr .b span.m{display:block;font-size:12.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dsum{margin:8px 0 4px;font-size:15px;line-height:1.5}
  .chip.auto{border-style:dashed}
  footer{margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line);font:13px/1.55 system-ui,sans-serif;color:var(--mute)}
  footer p{margin:0 0 8px}
  footer a{color:var(--accent)}
  details .np{margin:0 0 1.4em;font:14px/1.65 system-ui,sans-serif}
  details .nh{margin:1.8em 0 .6em}
  details > summary + .nh{margin-top:1em}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{font:12px system-ui,sans-serif;border:1px solid var(--line);border-radius:12px;padding:1px 9px;color:var(--mute)}
  .chip b{color:var(--ink)}
  .big{font:700 22px system-ui,sans-serif}
  .big small{font:13px system-ui,sans-serif;color:var(--mute);font-weight:400}
  ul.hl{margin:8px 0 0;padding-left:18px;font:13px/1.45 system-ui,sans-serif;color:var(--mute)}
  .dom{font:600 12px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:10px 0 2px}
  nav{font:14px system-ui,sans-serif;margin:0 0 18px}
  nav a{color:var(--accent);margin-right:14px;text-decoration:none;font-weight:600}
  nav a[aria-current]{color:var(--ink);border-bottom:2px solid var(--accent)}
  .pr{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line);font:14px/1.4 system-ui,sans-serif}
  .pr:last-child{border-bottom:0}
  .tag{flex:none;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--mute)}
  .tag.merged{color:#2e7d32;border-color:#2e7d32}.tag.opened{color:var(--accent);border-color:var(--accent)}
  .pr a{color:var(--ink);text-decoration:none;font-weight:600}.pr span.m{color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>GitHub digest</h1>
  <p class="sub" id="meta">Loading…</p>
  <nav><a href="./" aria-current="page">Digest</a><a href="liquidity.html">GNUS liquidity</a></nav>
  <h2>At a glance</h2>
  <div class="card" id="overview"></div>
  <h2>Mainnet readiness</h2>
  <div id="changes"></div>
  <div id="readiness"></div>
  <h2>This week</h2>
  <div class="card" id="week"></div>
  <h2>Activity by domain</h2>
  <div class="grid2" id="domains"></div>
  <h2>Issues &amp; pull requests</h2>
  <div class="card" id="prs"></div>
  <h2>Trends</h2>
  <div class="grid2" id="trends"></div>
  <h2>Daily</h2>
  <div id="days"></div>
  <footer id="foot"></footer>
</main>
<script>
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const safeUrl = u => /^https:\/\/(github\.com|docs\.gnus\.ai)\//.test(u) ? u : null;   // les messages de commit ne sont jamais injectés en HTML

// courbe simple (SVG) : pts = [{date, v}]
function spark(title, pts) {
  const card = el('div', null, 'card'); card.append(el('div', title, 'date'));
  const v = pts.filter(p => p.v != null);
  if (v.length < 2) { card.append(el('div', `Not enough history yet (${v.length} day${v.length === 1 ? '' : 's'}). The chart builds up daily.`, 'legend')); return card; }
  const W = 300, H = 70, pad = 6, vals = v.map(p => p.v), min = 0, max = Math.max(...vals, 1);   // l'échelle part de zéro : une petite variation reste petite
  const X = i => pad + i * (W - 2 * pad) / (v.length - 1), Y = x => H - pad - (x - min) / ((max - min) || 1) * (H - 2 * pad);
  const NS = 'http://www.w3.org/2000/svg', svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('class', 'chart'); svg.setAttribute('role', 'img'); svg.setAttribute('aria-label', title);
  const line = document.createElementNS(NS, 'polyline');
  line.setAttribute('points', v.map((p, i) => `${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' '));
  line.setAttribute('fill', 'none'); line.setAttribute('stroke', 'currentColor'); line.setAttribute('stroke-width', '2');
  const dot = document.createElementNS(NS, 'circle');
  dot.setAttribute('cx', X(v.length - 1)); dot.setAttribute('cy', Y(v[v.length - 1].v)); dot.setAttribute('r', '3.5'); dot.setAttribute('fill', 'currentColor');
  const last = v[v.length - 1].v, delta = last - v[0].v;
  const big = el('div', String(last), 'big'); big.append(el('small', delta ? ` ${delta > 0 ? '+' : ''}${delta} over the period` : ' no change over the period'));
  svg.append(line, dot);
  card.append(big, svg);
  card.append(el('div', `${v[0].date} → ${v[v.length - 1].date}`, 'legend'));
  return card;
}
const fmtDate = s => s ? new Date(s).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';

fetch('digest.json', { cache: 'no-store' }).then(r => r.json()).then(d => {
  document.getElementById('meta').textContent =
    `${d.org} · updated ${new Date(d.generatedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })}` +
    (d.aiError ? ' · AI unavailable: ' + d.aiError : '');

  // ---- changements depuis la semaine dernière
  const chBox = document.getElementById('changes'), C = d.changes;
  if (C) {
    const card = el('div', null, 'card');
    if (!C.since) card.append(el('div', 'Change tracking started today. Comparisons with the previous week will appear after the next daily updates.', 'legend'));
    else {
      card.append(el('div', `Changes since ${C.since}`, 'date'));
      let any = false;
      const badge = (t, st) => el('span', t, 'badge ' + (st || ''));
      if (C.readiness) {
        for (const it of C.readiness.items) {
          any = true; const r = el('div', null, 'srow');
          if (it.type === 'status') r.append(badge(it.from, it.fromStatus), el('span', '→', 'arrow'), badge(it.to, it.toStatus), el('span', it.label));
          else if (it.type === 'added') r.append(el('span', 'New', 'badge'), badge(it.to, it.toStatus), el('span', it.label));
          else r.append(el('span', 'Removed', 'badge'), el('span', it.label));
          r.append(el('div', it.page.replace(/-/g, ' ') + ' · ' + it.section, 'd')); card.append(r);
        }
        for (const t of C.readiness.trackDeltas) { any = true; const u = typeof t.from === 'number' ? '%' : ' done'; card.append(el('div', `${t.name}: ${t.from}${u === '%' ? '%' : ''} → ${t.to}${u}`, 'srow')); }
        if (!C.readiness.items.length && !C.readiness.trackDeltas.length) card.append(el('div', 'No change in the readiness status.', 'srow'));
      } else card.append(el('div', 'Readiness comparison is not available for this period.', 'srow'));
      for (const m of C.metrics) { any = true; card.append(el('div', `${m.label}: ${m.from} → ${m.to} (${m.delta > 0 ? '+' : ''}${m.delta})`, 'srow')); }
    }
    chBox.append(card);
  }

  const rd = document.getElementById('readiness'), R = d.readiness;
  const seenNotes = new Set();                              // paragraphes déjà affichés sur une page précédente
  const alerts = el('div'); if (R) rd.append(alerts);      // boîtes d'alerte uniques, affichées avant les pages
  if (!R) rd.append(Object.assign(el('div', d.readinessError ? 'Could not load readiness (' + d.readinessError + ')' : 'No data yet.'), { className: 'card' }));
  else for (const pg of R.pages) {
    const h3 = el('h3'); const a = el('a', pg.key.replace(/-/g, ' ')); if (safeUrl(pg.url)) { a.href = pg.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; } h3.append(a); rd.append(h3);
    if (pg.error) { rd.append(Object.assign(el('div', pg.error), { className: 'card' })); continue; }
    const fresh = [];
    if (pg.statusDate) fresh.push(`Status date: ${pg.statusDate}` + (pg.statusAgeDays != null ? ` (${pg.statusAgeDays} days ago)` : ''));
    if (pg.lastEdited) fresh.push(`source last edited ${fmtDate(pg.lastEdited)} (${pg.editedAgeDays} days ago)`);
    if (fresh.length) rd.append(el('div', fresh.join(' · '), 'legend'));
    for (const t of pg.tracks) {
      if (t.kind === 'table') {
        const tc = el('div', null, 'card');
        tc.append(el('div', t.name, 'date'));
        for (const it of t.items) {
          const r = el('div', null, 'srow');
          r.append(el('span', it.statusText, 'badge ' + it.status), el('span', it.label));
          if (it.detail) r.append(el('div', it.detail, 'd'));
          tc.append(r);
        }
        rd.append(tc); continue;
      }
      const c = el('div', null, 'card');
      const row = el('div', null, 'trow'); row.append(el('b', t.name), el('span', `${t.done}/${t.total} done`, 'pct')); c.append(row);
      if (t.summary) c.append(el('div', t.summary, 'legend'));
      // pas de barre de progression quand la doc précise qu'il s'agit de zones à préparer, pas d'étapes datées
      const noBar = /not (completed )?milestones|readiness areas|dated commitments/i.test((t.summary || '') + ' ' + (t.note || ''));
      if (!noBar) { const segs = el('div', null, 'segs'); for (const it of t.items) segs.append(el('span', null, 'seg ' + it.status)); c.append(segs); }
      c.append(el('div', `${t.done} done · ${t.progress} in progress · ${t.todo} to do (of ${t.total})`, 'legend'));
      for (const it of t.items) {
        const row2 = el('div', null, 'it'); row2.append(el('span', ({ done: '✅', progress: '🔄', todo: '⬜' })[it.status] + ' ' + it.label));
        if (it.target) row2.append(el('span', ' → ' + it.target, 't')); c.append(row2);
      }
      if (t.note) c.append(el('div', t.note, 'note'));
      if (t.total >= 8 && t.done / t.total >= 0.8) {          // longue liste presque terminée = historique : repliée
        const hd = el('details'); hd.append(el('summary', `${t.name} — ${t.done}/${t.total} done`)); hd.append(c); rd.append(hd);
      } else rd.append(c);
    }
    if (!pg.tracks.length || pg.notes.length) {
      const det = el('details'); det.append(el('summary', pg.tracks.length ? 'Notes' : 'Page content'));
      for (const n of pg.notes) {
        const lines = n.lines.filter(l => !/^Status date/i.test(l)).filter(l => {
          const k = l.toLowerCase().replace(/\s+/g, ' ').trim(); if (seenNotes.has(k)) return false; seenNotes.add(k); return true;
        });
        if (!lines.length) continue;
        if (n.heading) det.append(el('div', n.heading, 'date nh'));
        for (const l of lines) det.append(el('p', l, 'np'));
      }
      if (det.children.length > 1) rd.append(det);
    }
  }

  // objectifs dépassés : UNE seule boîte, UNE ligne par trimestre (la plus précise), toutes pages confondues
  if (R) {
    const stale = R.pages.filter(p => p.stale);
    if (stale.length) {
      const sw = el('div', null, 'card notice');
      sw.append(el('div', stale.length > 1 ? 'Some documentation pages have not been updated for a while' : 'A documentation page has not been updated for a while', 'w'),
        el('div', stale.map(p => `${p.key.replace(/-/g, ' ')} (${p.statusAgeDays ?? p.editedAgeDays} days old)`).join(', ') + ` — not updated for over ${R.staleDays || 60} days. The status shown may have changed since; check the original pages.`));
      alerts.append(sw);
    }
    const best = new Map(), score = x => (x.fromStatus ? 0 : 1000) + x.line.length;
    // seules les étapes de roadmap non terminées comptent : les phrases libres sont déjà lisibles dans les notes de la page
    for (const pg of R.pages) for (const t of (pg.targets || [])) if (t.passed && t.fromStatus !== false) {
      const cur = best.get(t.label);
      if (!cur || score(t) < score(cur.t)) best.set(t.label, { t, key: pg.key });
    }
    if (best.size) {
      const qn = l => { const m = l.match(/Q([1-4]) (\d{4})/); return +m[2] * 10 + +m[1]; };
      const w2 = el('div', null, 'card notice'); w2.append(el('div', 'Targets mentioned in the docs that are already in the past', 'w'));
      for (const [label, { t, key }] of [...best].sort((x, y) => qn(x[0]) - qn(y[0]))) {
        const row = el('div', null, 'it');
        row.append(el('span', t.line.startsWith(label) ? t.line : `${label} — ${t.line}`), el('span', ' · ' + key.replace(/-/g, ' '), 't'));
        w2.append(row);
      }
      alerts.append(w2);
    }
  }

  const w = d.week, wk = document.getElementById('week');

  // ---- vue d'ensemble : où en est GNUS ?
  const ov = document.getElementById('overview'), kv = el('div', null, 'kv');
  const kvItem = (k, ...nodes) => { const it = el('div'); it.append(el('div', k, 'k')); const v = el('div', null, 'v'); v.append(...nodes); it.append(v); kv.append(it); };
  const mainnet = [];
  if (R) for (const pg of R.pages) for (const t of pg.tracks) if (t.kind === 'table') for (const it of t.items) if (/mainnet/i.test(it.label)) mainnet.push(it);
  for (const it of mainnet.slice(0, 2)) kvItem(it.label, el('span', it.statusText, 'badge ' + it.status));
  kvItem('Activity (7 days)', document.createTextNode(`${w.commits} commits · ${w.repos} repos · ${w.contributors} contributors` + ((w.domains || [])[0] ? ` — mostly ${w.domains[0].name}` : '')));
  const lastRel = (d.days || []).flatMap(x => x.releases || [])[0];
  if (lastRel) {
    const a = el('a', `${lastRel.repo} ${lastRel.tag}`);
    if (safeUrl(lastRel.url)) { a.href = lastRel.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
    kvItem('Latest release', a, document.createTextNode(` · ${fmtDate(lastRel.date)}`));
  } else kvItem('Latest release', document.createTextNode('None this week' + (w.ciBuilds ? ` (${w.ciBuilds} CI builds)` : '')));
  if (R) { const ages = R.pages.map(p => p.editedAgeDays).filter(x => x != null); if (ages.length) kvItem('Docs last edited', document.createTextNode(`${Math.min(...ages)} days ago`)); }
  ov.append(kv);

  wk.append(el('div', `${w.from} → ${w.to}`, 'date'), el('div', w.summary || w.headline));
  const st = el('div', null, 'stats');
  for (const [k, v] of [['commits', w.commits], ['automated commits', w.automated], ['repos', w.repos], ['contributors', w.contributors], ['releases', w.releases], ['CI builds', w.ciBuilds]]) {
    const s = el('span', ` ${k}`); s.prepend(el('b', v)); st.append(s);
  }
  wk.append(st);

  const prBox = document.getElementById('prs'), P = d.prs;
  if (!P) { prBox.append(el('div', d.prsError ? 'Could not load issues and pull requests (' + d.prsError + ')' : 'No data yet.')); }
  else {
    const groups = [
      ['Last 7 days', [['PRs opened', P.prsOpened], ['PRs merged', P.prsMerged], ['issues opened', P.issuesOpened], ['issues closed', P.issuesClosed]]],
      ['Right now (all ages)', [['open PRs', P.openPrs], ['open issues', P.openIssues]]],
      ['Since the beginning', [['merged PRs', P.mergedPrsTotal], ['closed issues', P.closedIssuesTotal]]]];
    for (const [title, stats] of groups) {
      prBox.append(el('div', title, 'legend'));
      const ps = el('div', null, 'stats'); ps.style.marginBottom = '8px';
      for (const [k, v] of stats) { const sp = el('span', ` ${k}`); sp.prepend(el('b', v)); ps.append(sp); }
      prBox.append(ps);
    }
    const list = el('div'); list.style.marginTop = '10px';
    for (const it of P.items.slice(0, 15)) {
      const row = el('div', null, 'pr');
      const a = el('a', `${it.title}`); if (safeUrl(it.url)) { a.href = it.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
      const body = el('div', null, 'b'); body.append(a, el('span', `${it.repo}#${it.number} · ${it.author}`, 'm'));
      row.append(el('span', `${it.event} ${it.type === 'pr' ? 'PR' : 'issue'}`, 'tag ' + it.event), body);
      list.append(row);
    }
    if (!P.items.length) list.append(el('div', 'No issue or pull request activity this week.'));
    prBox.append(list);
  }

  const tr = document.getElementById('trends'), T = d.trend || [];
  for (const [title, key] of [['Commits (rolling 7 days)', 'commits'], ['Open issues', 'openIssues'], ['Open PRs', 'openPrs'], ['Merged PRs (total)', 'mergedPrs']])
    tr.append(spark(title, T.map(p => ({ date: p.date, v: p[key] }))));

  // ---- pied de page : sources et méthode
  const ft = document.getElementById('foot');
  ft.append(el('div', 'Sources & method', 'date'));
  const fp = (...nodes) => { const p = el('p'); p.append(...nodes); ft.append(p); };
  const ext = (text, url) => { const a = el('a', text); a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; };
  fp(document.createTextNode('Data comes from the GitHub API (public repositories of '), ext(d.org, 'https://github.com/' + d.org),
     document.createTextNode('), the documentation repository '), ext('GeniusVentures/gitbook', 'https://github.com/GeniusVentures/gitbook'),
     document.createTextNode(', and on-chain data read live on the liquidity page.'));
  fp(document.createTextNode(d.ai
    ? `Daily and weekly summaries are written by an AI model (${d.ai}) from public commit messages and may contain errors.`
    : 'Summaries are generated automatically from commit messages (no AI model on this run).'));
  fp(document.createTextNode('Liquidity figures are estimates from on-chain pool data; gas, other pools and market moves are not included. Public information, not financial advice.'));
  fp(document.createTextNode(`Updated ${new Date(d.generatedAt).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })} · script ${d.builder || 'v1'}`));

  const domBox = document.getElementById('domains');
  for (const g of (w.domains || [])) {
    const c = el('div', null, 'card');
    c.append(el('div', g.name, 'date'));
    const big = el('div', String(g.commits), 'big'); big.append(el('small', ` commit${g.commits === 1 ? '' : 's'}` + (g.automated ? ` · +${g.automated} automated` : '')));
    c.append(big);
    if (g.summary) c.append(el('div', g.summary, 'dsum'));
    const chips = el('div', null, 'chips');
    for (const r of g.repos) {
      if (r.commits === 0 && r.automated) { chips.append(el('span', `${r.name} · automated ×${r.automated}`, 'chip auto')); continue; }
      const ch = el('span', null, 'chip'); ch.append(el('b', r.name), document.createTextNode(` ${r.commits}`)); chips.append(ch);
    }
    c.append(chips);
    if (g.highlights.length) {
      const list = el('ul', null, 'hl'); for (const t of g.highlights.slice(0, 3)) list.append(el('li', t));
      if (g.summary) { const det = el('details'); det.append(el('summary', 'Show commits')); det.append(list); c.append(det); }   // phrase IA = commits repliés
      else c.append(list);
    }
    domBox.append(c);
  }
  if (!(w.domains || []).length) domBox.append(Object.assign(el('div', 'No activity to group this week.'), { className: 'card' }));

  const days = document.getElementById('days');
  for (const day of d.days) {
    const c = el('div', null, 'card');
    c.append(el('div', new Date(day.date + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' }), 'date'),
             el('div', day.summary || day.headline));
    if (day.repos.length) {
      const det = el('details'); det.append(el('summary', 'Details'));
      const byDom = new Map();
      for (const r of day.repos) { const k = r.domain || 'Other'; if (!byDom.has(k)) byDom.set(k, []); byDom.get(k).push(r); }
      for (const [dom, repos] of byDom) {
        det.append(el('div', dom, 'dom'));
        const ul = el('ul');
        for (const r of repos) {
          const li = el('li'), a = el('a', r.name); if (safeUrl(r.url)) { a.href = r.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; }
          li.append(a, el('span', ` (${r.commits}): ` + r.items.map(i => i.text).join(' · ')));
          const nb = (r.branches || []).filter(b => !/^(main|master|develop|dev)$/i.test(b));
          if (nb.length) li.append(el('span', ` [branches: ${nb.slice(0, 4).join(', ')}${nb.length > 4 ? ' +' + (nb.length - 4) : ''}]`));
          ul.append(li);
        }
        det.append(ul);
      }
      c.append(det);
    }
    days.append(c);
  }
}).catch(e => { document.getElementById('meta').textContent = 'Could not load digest.json (' + e.message + ')'; });
</script>
</body>
</html>
