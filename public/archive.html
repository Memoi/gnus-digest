<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GNUS digest — archive</title>
<meta name="description" content="Past daily summaries of the GeniusVentures GitHub activity, grouped by week.">
<meta property="og:type" content="website">
<meta property="og:title" content="GNUS digest — archive">
<meta property="og:description" content="Past daily summaries of the GeniusVentures GitHub activity, grouped by week.">
<meta property="og:url" content="https://gnus-digest.vercel.app/archive.html">
<meta property="og:image" content="https://gnus-digest.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://gnus-digest.vercel.app/og.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">

  <link rel="stylesheet" href="site.css">
</head>
<body class="archive-page">
<main>

  <nav><a href="./">Digest</a><a href="liquidity.html">GNUS liquidity</a><a href="holders.html">GNUS holders</a><a href="archive.html" aria-current="page">Archive</a></nav>
  <h1 class="sr-only">Archive</h1>
  <nav class="jump" id="weekJump" aria-label="Jump to archive week" hidden>
    Jump to:
  </nav>
  <p class="sub" id="meta">Loading…</p>
  <input id="q" type="search" placeholder="Filter by repository, domain or keyword…" aria-label="Filter the archive">
  <div id="weeks"></div>
  <footer>Daily summaries are kept as they were written the day after. Days with no activity are not listed. Written by an AI model when available, otherwise generated from commit messages (marked “auto”); they may contain errors.</footer>
  <div class="totop"><button type="button" id="toTop">↑ Back to top</button></div>
</main>
<script>
document.getElementById('toTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }));
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const safeUrl = u => /^https:\/\/github\.com\//.test(u) ? u : null;
const fmtDay = s => new Date(s + 'T12:00:00Z').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const monday = s => { const d = new Date(s + 'T12:00:00Z'); d.setUTCDate(d.getUTCDate() - ((d.getUTCDay() + 6) % 7)); return d.toISOString().slice(0, 10); };

let ALL = [];
function render(filter) {
  const box = document.getElementById('weeks');
  box.textContent = '';

  const jump = document.getElementById('weekJump');
  jump.replaceChildren(document.createTextNode('Jump to: '));
  jump.hidden = true;
  const f = (filter || '').trim().toLowerCase();
  const match = e => !f || [e.text, ...(e.repos || []), ...(e.domains || []).map(x => x.name), ...(e.releases || []).map(r => `${r.repo} ${r.tag}`)].join(' ').toLowerCase().includes(f);
  const weeks = new Map();
  for (const e of ALL.filter(match)) { const k = monday(e.date); if (!weeks.has(k)) weeks.set(k, []); weeks.get(k).push(e); }
  if (!weeks.size) { box.append(el('p', f ? 'Nothing matches this filter.' : 'The archive is empty for now: it fills up one day at a time.', 'sub')); return; }
  let n = 0;
  for (const [wk, entries] of [...weeks].sort((a, b) => b[0].localeCompare(a[0]))) {
    entries.sort((a, b) => b.date.localeCompare(a.date));
    const det = el('details', null, 'week');
    det.id = 'week-' + wk;
    if (n++ < 2 || f) det.open = true;

    const jumpDate = new Date(wk + 'T12:00:00Z').toLocaleDateString('en-GB', {
      day: 'numeric',
      month: 'short',
      year: 'numeric',
      timeZone: 'UTC'
    });

    if (jump.querySelector('a')) {
      jump.append(document.createTextNode(' · '));
    }

    const jumpLink = el('a', jumpDate);
    jumpLink.href = '#' + det.id;
    jump.append(jumpLink);
    jump.hidden = false;

    const repos = new Set(entries.flatMap(e => e.repos || []));
    const sum = el('summary'); sum.append(document.createTextNode('Week of ' + new Date(wk + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }) + ' (Mon–Sun)'),
      el('span', ` · ${entries.reduce((s, e) => s + (e.commits || 0), 0)} commits · ${repos.size} repos · ${entries.length} active day${entries.length === 1 ? '' : 's'}`, 'tot'));
    det.append(sum);
    for (const e of entries) {
      const day = el('div', null, 'day'), d = el('div', fmtDay(e.date), 'd'); if (!e.ai) d.append(el('span', 'auto', 'auto'));
      day.append(d, el('p', e.text, 't'));
      const chips = el('div', null, 'chips');
      for (const g of (e.domains || [])) chips.append(el('span', g.commits ? `${g.name} · ${g.commits}` : `${g.name} · automated only`, g.commits ? 'chip' : 'chip auto'));
      for (const r of (e.releases || [])) { const c = el('span', null, 'chip rel'), a = el('a', `${r.repo} ${r.tag}`); const u = safeUrl(r.url); if (u) { a.href = u; a.target = '_blank'; a.rel = 'noopener noreferrer'; } c.append(a); chips.append(c); }
      if (chips.children.length) day.append(chips);
      det.append(day);
    }
    box.append(det);
  }
}
fetch('archive.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : []).catch(() => []).then(a => {
  ALL = Array.isArray(a) ? a : [];
  document.getElementById('meta').textContent = ALL.length ? `${ALL.length} days of activity since ${new Date(ALL[0].date + 'T12:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' })}` : 'No archived days yet';
  render('');
  document.getElementById('q').addEventListener('input', e => render(e.target.value));
});
</script>
</body>
</html>
